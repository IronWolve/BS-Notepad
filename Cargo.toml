[package]
name = "bs-notepad"
version = "0.5.0"
edition = "2021"

[dependencies]
fontdb = "0.24.0"
pulldown-cmark = "0.13"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5"
tao = "0.37"
two-face = "0.5.2"
wry = "0.57"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.21.3", default-features = false }
