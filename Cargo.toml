[package]
name = "notepad"
version = "0.1.0"
edition = "2021"

[dependencies]
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5"
tao = "0.37"
wry = "0.57"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
