[package]
name = "bs-notepad"
version = "0.7.2"
edition = "2021"
rust-version = "1.95"
homepage = "https://github.com/IronWolve"

[dependencies]
html5ever = "0.29.1"
fontdb = "0.24.0"
pulldown-cmark = "0.13"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5"
tao = "0.37"
two-face = "0.5.2"
wry = "0.57"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.21.3", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.17.2", default-features = false }

[package.metadata.app]
display-name = "BS Notepad"
